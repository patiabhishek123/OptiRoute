# Local development infrastructure.
# OSRM runs only with the `routing` profile (`make osrm-up`), after `make osrm-build`.
# Host ports are overridable via .env (see .env.example).
name: optiroute

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-optiroute}
      POSTGRES_USER: ${POSTGRES_USER:-optiroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optiroute}
    ports:
      - "127.0.0.1:${OPTI_PG_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${OPTI_REDIS_PORT:-16379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  osrm:
    profiles: [routing]
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v6.0.0}
    command: >-
      osrm-routed --algorithm mld --max-table-size ${OSRM_MAX_TABLE_SIZE:-1000}
      /data/${OSRM_REGION:-odisha}.osrm
    ports:
      - "127.0.0.1:${OPTI_OSRM_PORT:-15000}:5000"
    volumes:
      - ./services/routing/osrm/data:/data:ro
    mem_limit: ${OSRM_MEM_LIMIT:-2g}
    cpus: 2
    healthcheck:
      # Image has busybox wget, no curl; 127.0.0.1 because "localhost" resolves to ::1 first.
      # The probe point is central Bhubaneswar, so a healthy Odisha router answers 200.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/nearest/v1/driving/85.82,20.29"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
