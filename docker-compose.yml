# Local development infrastructure. OSRM is added in Phase 2.
# Host ports are overridable via .env (see .env.example).
name: optiroute

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-optiroute}
      POSTGRES_USER: ${POSTGRES_USER:-optiroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optiroute}
    ports:
      - "127.0.0.1:${OPTI_PG_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${OPTI_REDIS_PORT:-16379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
