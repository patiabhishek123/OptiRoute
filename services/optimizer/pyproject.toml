[project]
name = "optiroute-optimizer"
version = "0.1.0"
description = "OptiRoute optimization engine (HCVRPTW: heuristics + OR-Tools + local search)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ortools>=9.12",
    "pydantic>=2.9",
]

[project.scripts]
optiroute = "optiroute.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optiroute"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
