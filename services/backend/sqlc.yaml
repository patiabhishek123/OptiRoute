# sqlc: SQL in, typed Go out. Schema = the goose migrations (sqlc reads only the Up sections).
# Each module owns its queries and generated store package (spec §6: modules own data access).
# Regenerate with `make sqlc`; CI fails if generated code is stale.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/identity/queries.sql
    gen:
      go: &go
        package: store
        out: internal/identity/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
  - engine: postgresql
    schema: migrations
    queries: internal/geography/queries.sql
    gen:
      go:
        <<: *go
        out: internal/geography/store
  - engine: postgresql
    schema: migrations
    queries: internal/fleet/queries.sql
    gen:
      go:
        <<: *go
        out: internal/fleet/store
  - engine: postgresql
    schema: migrations
    queries: internal/orders/queries.sql
    gen:
      go:
        <<: *go
        out: internal/orders/store
