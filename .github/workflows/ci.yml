name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  optimizer:
    runs-on: ubuntu-latest
    services:  # for the worker integration tests (tests/test_worker.py)
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: optiroute
          POSTGRES_USER: optiroute
          POSTGRES_PASSWORD: optiroute
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U optiroute" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["16379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: services/optimizer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/optimizer/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: optiroute
          POSTGRES_USER: optiroute
          POSTGRES_PASSWORD: optiroute
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U optiroute" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["16379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: services/backend
    env:
      TEST_DATABASE_URL: postgres://optiroute:optiroute@localhost:15432/optiroute?sslmode=disable
      TEST_REDIS_URL: redis://localhost:16379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/backend/go.mod
          cache-dependency-path: services/backend/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: sqlc generated code is up to date
        run: go tool sqlc diff
      - run: go vet ./...
      - run: go test -race ./...

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # Browser tests against the real stack. No OSRM in CI (the regional dataset is too heavy to build
    # here): the worker uses haversine matrices and the map draws straight lines. These are the
    # designed degraded modes, and the tests assert what is rendered, not that roads were used.
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: optiroute
          POSTGRES_USER: optiroute
          POSTGRES_PASSWORD: optiroute
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U optiroute" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["16379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://optiroute:optiroute@localhost:15432/optiroute?sslmode=disable
      REDIS_URL: redis://localhost:16379/0
      JWT_SECRET: ci-only-jwt-secret-ci-only-jwt-secret-0123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/backend/go.mod
          cache-dependency-path: services/backend/go.sum
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Start API
        working-directory: services/backend
        run: |
          go build -o /tmp/api ./cmd/api
          MIGRATE_ON_START=true nohup /tmp/api serve > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/readyz && break; sleep 1; done
      - name: Start optimizer worker
        working-directory: services/optimizer
        run: |
          uv sync --locked
          nohup uv run optiroute worker > /tmp/worker.log 2>&1 &
      - name: Browser tests
        working-directory: apps/dashboard
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs and traces on failure
        if: failure()
        run: tail -n 100 /tmp/api.log /tmp/worker.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/dashboard/test-results
