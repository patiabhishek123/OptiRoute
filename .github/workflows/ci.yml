name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  optimizer:
    runs-on: ubuntu-latest
    services:  # for the worker integration tests (tests/test_worker.py)
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: optiroute
          POSTGRES_USER: optiroute
          POSTGRES_PASSWORD: optiroute
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U optiroute" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["16379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: services/optimizer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/optimizer/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: optiroute
          POSTGRES_USER: optiroute
          POSTGRES_PASSWORD: optiroute
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U optiroute" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["16379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: services/backend
    env:
      TEST_DATABASE_URL: postgres://optiroute:optiroute@localhost:15432/optiroute?sslmode=disable
      TEST_REDIS_URL: redis://localhost:16379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/backend/go.mod
          cache-dependency-path: services/backend/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
